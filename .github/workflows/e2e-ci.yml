name: "Tests: E2E"

on: [pull_request]

env:
  GITHUB_PR_NUMBER: ${{github.event.pull_request.number}}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_unit:
    name: Lint, type-check, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            example-project/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit

  tests_e2e:
    name: Run end-to-end tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 20 went EOL 2026-04-30 and is deliberately excluded: the
        # electronApp.evaluate() stress test times out on it (reproduced on both
        # windows-latest and macos-latest, never on 22 or 24), so keeping it here
        # only produces red builds for an unsupported runtime.
        # 22 is Maintenance LTS, 24 is Active LTS.
        node_version: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            commandPrefix: 'xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24 +extension GLX +render -noreset" --'
          - os: windows-latest
            commandPrefix: ''
          - os: macos-latest
            commandPrefix: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            example-project/package-lock.json
      - name: Install system dependencies (Ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libxkbcommon-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxrandr-dev \
            libgbm-dev \
            libxss-dev \
            libasound2-dev
      - name: Install dependencies
        run: npm ci && cd example-project && npm ci
      - name: e2e tests
        run: ${{ matrix.commandPrefix }} npm run test:e2e
